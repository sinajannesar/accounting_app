name: Windows Build and Test

on:
  push:
    branches:
      - agents/python-app-performance-optimization
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10 (x86)
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          architecture: 'x86'

      - name: Show python info
        run: |
          python --version
          python -c "import struct,platform; print(platform.architecture(), struct.calcsize('P')*8)"
        shell: cmd

      - name: Create virtualenv (venv32)
        run: |
          python -m venv venv32
          echo venv created
        shell: cmd

      - name: Activate venv & upgrade pip
        run: |
          call venv32\Scripts\activate.bat
          python -m pip install --upgrade pip setuptools wheel
          pip --version
        shell: cmd

      - name: Install requirements
        run: |
          call venv32\Scripts\activate.bat
          pip install -r requirements.txt > pip_install.log 2>&1 || (type pip_install.log & exit /b %ERRORLEVEL%)
          type pip_install.log
        shell: cmd
        timeout-minutes: 20

      - name: Install PyInstaller
        run: |
          call venv32\Scripts\activate.bat
          pip install pyinstaller > pyinstaller_install.log 2>&1 || (type pyinstaller_install.log & exit /b %ERRORLEVEL%)
          pyinstaller --version || echo pyinstaller not available
          type pyinstaller_install.log
        shell: cmd

      - name: Run PyInstaller (debug)
        run: |
          call venv32\Scripts\activate.bat
          pyinstaller --onedir --noconfirm --windowed --name Hesabdari --noupx --log-level=DEBUG main.py > pyinstaller_build.log 2>&1 || echo PYINSTALLER_EXIT=%ERRORLEVEL% > pyinstaller_build.log
          type pyinstaller_build.log
        shell: cmd
        timeout-minutes: 30

      - name: Show dist folder (if any)
        if: always()
        run: |
          if exist dist\Hesabdari (
            echo dist exists, listing contents:
            dir dist\Hesabdari
          ) else (
            echo dist\Hesabdari not found
          )
        shell: cmd

      - name: Upload logs and dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hesabdari-dist
          path: |
            dist/Hesabdari/**
            dist_installer/Hesabdari_Setup.exe
            pyinstaller_build.log
            pyinstaller_install.log
            pip_install.log
            || true
